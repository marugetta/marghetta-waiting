<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>マルゲッタ 唐人町店 | 待受け受付</title>
<!-- マルゲッタ 待ちリストアプリ（宝雲亭版をベースに再構築） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #ea5539;
    --bg-deep: #fbe3d8;
    --panel: #ffffff;
    --panel-2: #fff6ee;
    --line: #f0c9b8;
    --red: #7c2530;
    --red-bright: #a5362f;
    --gold: #c9581c;
    --gold-soft: #e8721f;
    --paper: #2a1c12;
    --muted: #8a7358;
    --font-display: "Zen Kaku Gothic New", "Noto Sans JP", sans-serif;
    --font-body: "Zen Kaku Gothic New", "Noto Sans JP", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; height:100%; background: var(--bg); }
  .hn-root{
    background: var(--bg);
    color: var(--paper);
    font-family: var(--font-body);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 0 40px;
    position: relative;
    overflow-x: hidden;
  }
  .hn-root::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse 500px 260px at 50% -60px, rgba(255,255,255,0.10), transparent 70%),
      radial-gradient(ellipse 400px 300px at 90% 10%, rgba(0,0,0,0.08), transparent 70%);
    pointer-events:none;
  }
  .hn-shell{ max-width: 480px; margin: 0 auto; padding: 26px 20px 0; position:relative; }
  .hn-shell.wide{ max-width: 720px; }

  /* header */
  .hn-header{ text-align:center; margin-bottom: 18px; }
  .hn-mark{ display:flex; justify-content:center; margin-bottom: 6px; }
  .hn-mark-badge{
    width:64px; height:64px; border-radius:50%; background:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 16px rgba(0,0,0,0.18);
  }
  .hn-mark svg{ width:48px; height:48px; }
  .hn-word{
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 28px;
    letter-spacing: 0.06em;
    color: var(--paper);
    margin: 0;
  }
  .hn-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background: var(--gold-soft); vertical-align: top; margin-left: 3px; }
  .hn-tagline{ font-size: 11px; color: var(--paper); opacity: 0.7; letter-spacing: 0.15em; margin-top: 2px; }
  .hn-sub{
    font-size: 12px;
    color: var(--paper);
    letter-spacing: 0.2em;
    margin-top: 8px;
    font-weight: 700;
    opacity: 0.82;
  }
  .hn-tabs{
    position:absolute; top: 14px; right: 12px;
    display:flex; gap: 6px; font-size: 11px;
  }
  .hn-tab-link{
    color: var(--paper); text-decoration:none;
    border: 1px solid var(--line); border-radius: 20px;
    padding: 5px 10px; letter-spacing: 0.05em;
    background: rgba(255,255,255,0.88);
  }
  .hn-tab-link.active{ color: #fff6ee; background: var(--gold-soft); border-color: var(--gold-soft); font-weight:700; }

  /* language selector */
  .hn-langs{ display:flex; gap: 6px; justify-content:center; flex-wrap: wrap; margin-bottom: 18px; }
  .hn-lang-btn{
    font-size: 12px; padding: 6px 12px; border-radius: 20px;
    border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor:pointer;
  }
  .hn-lang-btn.active{ border-color: var(--gold-soft); color: var(--gold-soft); background: rgba(201,88,28,0.10); font-weight: 700; }

  /* card */
  .hn-card{
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 20px 24px;
    box-shadow: 0 18px 40px rgba(124,37,48,0.10);
  }
  .hn-notice{
    display:flex; align-items:center; gap:10px; flex-wrap: wrap;
    background: rgba(124,37,48,0.08);
    border: 1px solid rgba(124,37,48,0.28);
    color: var(--red);
    padding: 10px 14px; border-radius: 10px;
    font-size: 13px; font-weight: 700; letter-spacing: 0.03em;
    margin-bottom: 18px;
  }
  .hn-notice .dot{ width:7px; height:7px; border-radius:50%; background:var(--red-bright); box-shadow:0 0 0 4px rgba(165,54,47,0.22); flex-shrink:0; }
  .hn-notice-count{ font-weight: 900; color: var(--gold); }

  .hn-field{ margin-bottom: 18px; }
  .hn-label{ font-size: 12px; color: var(--muted); letter-spacing: 0.08em; margin-bottom: 8px; display:block; }
  .hn-label b{ color: var(--gold); font-weight:700; margin-right: 2px; }

  .hn-stepper{ display:flex; align-items:center; gap: 14px; }
  .hn-stepbtn{
    width: 42px; height: 42px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg-deep);
    color: var(--paper); font-size: 20px; font-weight: 700;
    cursor:pointer; user-select:none;
  }
  .hn-stepbtn:active{ background: var(--red); border-color: var(--red); color:#fff6ee; }
  .hn-count{
    font-family: var(--font-display); font-size: 30px; font-weight: 700;
    min-width: 60px; text-align:center;
  }
  .hn-count small{ font-size: 13px; font-family: var(--font-body); color: var(--muted); margin-left: 4px; }

  .hn-input{
    width: 100%; padding: 13px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg-deep);
    color: var(--paper); font-family: var(--font-body); font-size: 15px;
  }
  .hn-input::placeholder{ color: #b3a180; }
  .hn-input:focus, .hn-stepbtn:focus, .hn-seat input:focus + span, button:focus-visible{
    outline: 2px solid var(--gold-soft); outline-offset: 2px;
  }

  .hn-seats{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .hn-seat{ position:relative; }
  .hn-seat input{ position:absolute; opacity:0; inset:0; cursor:pointer; margin:0; }
  .hn-seat span{
    display:block; text-align:center; padding: 12px 8px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg-deep); font-size: 14px; color: var(--muted);
  }
  .hn-seat input:checked + span{
    border-color: var(--gold-soft); color: var(--gold); background: rgba(201,88,28,0.10); font-weight: 700;
  }

  .hn-submit{
    width:100%; margin-top: 6px; padding: 15px; border-radius: 12px; border: none;
    background: linear-gradient(180deg, var(--red-bright), var(--red));
    color: #fff6ee; font-family: var(--font-display); font-weight: 800; font-size: 16px;
    letter-spacing: 0.1em; cursor: pointer; box-shadow: 0 10px 24px rgba(124,37,48,0.30);
  }
  .hn-submit:disabled{ opacity: 0.6; cursor: default; }
  .hn-err{ color: var(--red-bright); font-size: 12px; margin-top: 8px; min-height: 16px; }

  /* ticket display */
  .hn-ticket{ text-align:center; padding: 26px 4px 8px; }
  .hn-ticket-label{
    font-size: 13px; color: var(--muted); letter-spacing:0.2em; font-weight: 700;
  }
  .hn-ticket-bignum{
    font-family: var(--font-display); font-weight: 900; font-size: 76px; line-height: 1.1;
    color: var(--gold); margin: 8px 0 4px; letter-spacing: 0.04em;
    text-shadow: 0 6px 18px rgba(201,88,28,0.22);
  }
  .hn-ticket-name{ font-size: 18px; font-weight: 700; margin-top: 10px; }
  .hn-ticket-meta{ color: var(--muted); font-size: 13px; margin-top: 4px; }
  .hn-ticket-status{
    margin-top: 18px; padding: 10px; border-radius: 10px;
    background: rgba(201,88,28,0.08); border: 1px solid rgba(201,88,28,0.30);
    color: var(--gold); font-size: 13px; font-weight: 700;
  }
  .hn-ticket-status.called{ background: rgba(165,54,47,0.12); border-color: rgba(165,54,47,0.4); color: var(--red-bright); }
  .hn-back{ margin-top: 16px; background:none; border:none; color: var(--muted); font-size: 12px; text-decoration: underline; cursor:pointer; }

  /* play-while-you-wait games */
  .hn-games{ margin-top: 20px; text-align:left; }
  .hn-games-label{ font-size: 12px; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 8px; text-align:center; }
  .hn-games-list{ display:flex; gap: 10px; }
  .hn-game-card{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding: 14px 8px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg-deep); text-decoration:none; color: var(--paper);
    font-size: 12px; font-weight: 700; text-align:center;
  }
  .hn-game-card:active{ border-color: var(--gold-soft); background: rgba(232,114,31,0.10); }
  .hn-game-emoji{ font-size: 24px; }

  /* staff view */
  .hn-summary{
    display:grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px;
  }
  .hn-summary-item{
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 6px; text-align: center;
  }
  .hn-summary-num{ font-family: var(--font-display); font-weight: 900; font-size: 26px; color: var(--gold); }
  .hn-summary-label{ font-size: 11px; color: var(--muted); margin-top: 2px; letter-spacing: 0.03em; }
  .hn-staffbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 14px; }
  .hn-staffbar .hn-updated{ font-size: 11px; color: var(--muted); }
  .hn-reset{
    font-size: 11px; color: var(--muted); background:none; border: 1px solid var(--line);
    border-radius: 20px; padding: 5px 10px; cursor:pointer;
  }
  .hn-empty{ text-align:center; color: var(--muted); padding: 40px 10px; font-size: 13px; }
  .hn-row{
    display:flex; align-items:center; gap: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .hn-row.called{ border-color: rgba(165,54,47,0.45); background: rgba(165,54,47,0.06); }
  .hn-row-num{
    font-family: var(--font-display); font-weight: 900; font-size: 20px; color: var(--gold);
    width: 34px; text-align:center; flex-shrink:0;
  }
  .hn-row-main{ flex: 1; min-width:0; }
  .hn-row-name{ font-weight: 700; font-size: 15px; }
  .hn-row-sub{ font-size: 12px; color: var(--muted); margin-top: 2px; display:flex; gap:8px; flex-wrap:wrap; }
  .hn-badge{
    font-size: 11px; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--line); color: var(--muted);
  }
  .hn-badge.called{ color: var(--red-bright); border-color: var(--red-bright); }
  .hn-badge.done{ color: #2f7a45; border-color: #4a8f5c; }
  .hn-badge.cancelled{ color: var(--muted); }
  .hn-row-actions{ display:flex; gap: 6px; flex-shrink:0; }
  .hn-abtn{
    font-size: 11px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg-deep); color: var(--paper); cursor:pointer; white-space:nowrap;
  }
  .hn-abtn.call{ border-color: var(--gold-soft); color: var(--gold); }
  .hn-abtn.done{ border-color: #4a8f5c; color: #2f7a45; }
  .hn-abtn.cancel{ color: var(--muted); }

  /* history panel */
  .hn-history{ margin-bottom: 16px; }
  .hn-history-day + .hn-history-day{ margin-top: 8px; }
  .hn-history-toggle{
    width:100%; display:flex; justify-content:space-between; align-items:center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 16px; color: var(--paper); font-size: 13px; font-weight: 700; cursor:pointer;
  }
  .hn-history-toggle .hn-chev{ color: var(--gold); font-size: 11px; font-weight: 700; }
  .hn-history-list{ margin-top: 8px; }
  .hn-history-row{
    display:flex; align-items:center; gap: 12px;
    background: rgba(0,0,0,0.02); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 14px; margin-bottom: 8px; opacity: 0.9;
  }
  .hn-history-row .hn-row-num{ font-size: 16px; }
  .hn-history-row .hn-row-name{ font-size: 14px; }

  @media (max-width: 400px){
    .hn-row{ flex-wrap: wrap; }
    .hn-row-actions{ width: 100%; justify-content:flex-end; }
  }
</style>
</head>

  function playCallAlert(){
    // Two-tone chime via Web Audio API — no external file needed, works offline.
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      [ [880, 0], [1175, 0.18] ].forEach(([freq, delay])=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, now + delay);
        gain.gain.linearRampToValueAtTime(0.35, now + delay + 0.02);
        gain.gain.linearRampToValueAtTime(0, now + delay + 0.32);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now + delay);
        osc.stop(now + delay + 0.34);
      });
      setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 800);
    }catch(e){ /* Web Audio unavailable — silently skip */ }
    try{ if(navigator.vibrate) navigator.vibrate([800,400,800,400,800,400,800,400,800]); }catch(e){ /* vibration unavailable — silently skip */ }
  }

  async function withRetry(fn, attempts){
    attempts = attempts || 3;
    let lastErr;
    for(let i=0;i<attempts;i++){
      try{ return await fn(); }
      catch(e){
        lastErr = e;
        console.error('[マルゲッタ] storage call failed (attempt '+(i+1)+'/'+attempts+'):', e);
        if(i < attempts-1) await new Promise(r=>setTimeout(r, 400 * (i+1)));
      }
    }
    throw lastErr;
  }

  async function fbGet(path){
    const res = await fetch(FIREBASE_DB_URL + path + '.json');
    if(!res.ok) throw new Error('Firebase GET failed: HTTP ' + res.status);
    return res.json();
  }
  async function fbPut(path, value){
    const res = await fetch(FIREBASE_DB_URL + path + '.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(value)
    });
    if(!res.ok) throw new Error('Firebase PUT failed: HTTP ' + res.status);
    return res.json();
  }

  async function loadState(){
    try{
      const data = await withRetry(()=>fbGet(STATE_PATH), 2);
      if(data){ state = data; if(!Array.isArray(state.entries)) state.entries = []; if(typeof state.counter !== 'number') state.counter = 0; }
    }catch(e){ /* unreachable — fall back to in-memory state */ }
  }
  async function saveState(){
    await withRetry(()=>fbPut(STATE_PATH, state), 3);
  }
  async function verifyEntrySaved(id){
    // Unlike loadState(), this does not swallow errors — callers need to know
    // whether the confirmation read itself succeeded, not just fall back silently.
    const data = await withRetry(()=>fbGet(STATE_PATH), 2);
    if(data && Array.isArray(data.entries)){
      return data.entries.some(e => e.id === id);
    }
    return false;
  }

  function isToday(ts){
    const d = new Date(ts), n = new Date();
    return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
  }
  function dayKeyJa(ts){
    const d = new Date(ts);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function dayLabelJa(ts){
    const d = new Date(ts);
    const wd = ['日','月','火','水','木','金','土'][d.getDay()];
    const md = (d.getMonth()+1)+'月'+d.getDate()+'日('+wd+')';
    return isToday(ts) ? '本日 '+md : md;
  }
  function timeAgo(ts){
    const tr = T[lang];
    const min = Math.max(0, Math.floor((Date.now() - ts)/60000));
    if(min < 1) return tr.justNow;
    return tr.waitMin(min);
  }

    root.innerHTML =

        '</div>'+

    let count = 2;

    document.getElementById('hnPlus').onclick = ()=>{ count = Math.min(20,count+1); countEl.innerHTML = count+'<small>'+tr.unit+'</small>'; };

    document.getElementById('hnSubmit').onclick = async ()=>{
      const name = document.getElementById('hnName').value.trim();
      const errEl = document.getElementById('hnErr');
      if(!name){ errEl.textContent = tr.errName; return; }
      const seatKey = document.querySelector('input[name="hnSeat"]:checked').value;
      const btn = document.getElementById('hnSubmit');
      btn.disabled = true; btn.textContent = tr.submitting;

      await loadState();
      const today = dayKeyJa(Date.now());
      if(state.counterDay && state.counterDay !== today){
        // A new day has started since the last ticket was issued — start
        // numbering over from 1 instead of carrying on from yesterday's count.
        state.counter = 0;
      }
      state.counterDay = today;
      state.counter += 1;
      const entry = {
        id: 'w'+Date.now()+Math.random().toString(36).slice(2,6),
        number: state.counter,
        name, count, seat: seatKey,
        status: 'waiting',
        createdAt: Date.now()

      state.entries.push(entry);

      // Move to the ticket screen right away — saving happens in the background.

      // acknowledgement is slow or drops, so there's no need to block on it here.)
      myTicketId = entry.id;
      lastKnownTicketStatus = entry.status;
      render();

      saveState().catch(saveErr=>{
        console.error('[マルゲッタ] saveState reported an error, verifying against storage:', saveErr);
        verifyEntrySaved(entry.id).then(ok=>{
          if(!ok) console.error('[マルゲッタ] entry could not be confirmed as saved:', entry.id);

        });
      });
      saveMyTicket(myTicketId);
    };

  function renderStaff(){
    const active = state.entries.filter(e => e.status==='waiting' || e.status==='called')
      .sort((a,b)=>a.number-b.number);
    const waitingOnly = active.filter(e=>e.status==='waiting');
    const longestWaitMin = active.length ? Math.max(...active.map(e=>Math.floor((Date.now()-e.createdAt)/60000))) : 0;
    const historyCutoff = Date.now() - HISTORY_WINDOW_MS;
    const historyEntries = state.entries.filter(e => (e.status==='done' || e.status==='cancelled') && e.createdAt >= historyCutoff)
      .sort((a,b)=>b.createdAt-a.createdAt);
    const historyGroups = [];
    const historyGroupsByKey = {};
    historyEntries.forEach(e=>{
      const key = dayKeyJa(e.createdAt);
      if(!historyGroupsByKey[key]){
        historyGroupsByKey[key] = { key: key, label: dayLabelJa(e.createdAt), items: [] };
        historyGroups.push(historyGroupsByKey[key]);
      }
      historyGroupsByKey[key].items.push(e);
    });
    const todayKey = dayKeyJa(Date.now());
    const todayGroup = historyGroupsByKey[todayKey] || null;
    const pastGroups = historyGroups.filter(g => g.key !== todayKey);
    const todayOpen = openHistoryDays.has(todayKey);

    root.innerHTML =
      '<div class="hn-shell wide">'+ tabsHTML() +
      '<div class="hn-header">'+logoHTML()+
      '<div class="hn-sub">スタッフ用 ウエイティング管理</div></div>'+
      '<div class="hn-summary">'+
        '<div class="hn-summary-item"><div class="hn-summary-num">'+active.length+'</div><div class="hn-summary-label">現在お待ちの組数</div></div>'+
        '<div class="hn-summary-item"><div class="hn-summary-num">'+waitingOnly.length+'</div><div class="hn-summary-label">未呼出</div></div>'+
        '<div class="hn-summary-item"><div class="hn-summary-num">'+(active.length? longestWaitMin+'分' : '−')+'</div><div class="hn-summary-label">最長待ち時間</div></div>'+
      '</div>'+
      '<div class="hn-history">'+
        '<button class="hn-history-toggle" data-hist-key="'+todayKey+'">'+
          '<span>本日の対応済みお客様（'+(todayGroup?todayGroup.items.length:0)+'組）</span>'+
          '<span class="hn-chev">'+(todayOpen?'閉じる ▲':'開く ▼')+'</span>'+
        '</button>'+
        (todayOpen ? '<div class="hn-history-list">'+
          (!todayGroup || todayGroup.items.length===0 ? '<div class="hn-empty">本日対応済みのお客様はまだいません</div>' :
            todayGroup.items.map(historyRowHTML).join(''))+
          '</div>' : '')+
      '</div>'+
      '<div class="hn-card">'+
        '<div class="hn-staffbar"><span class="hn-updated">'+active.length+'組が待機中です</span>'+
        '<button class="hn-reset" id="hnReset">本日の受付をリセット</button></div>'+
        (active.length===0 ? '<div class="hn-empty">現在、待っているお客様はいません</div>' :
          active.map(rowHTML).join('')) +
      '</div>'+
      (pastGroups.length===0 ? '' :
        '<div class="hn-label" style="margin:20px 2px 8px;">過去の履歴</div>'+
        '<div class="hn-history">'+
          pastGroups.map(function(g){
            const open = openHistoryDays.has(g.key);
            return '<div class="hn-history-day">'+
              '<button class="hn-history-toggle" data-hist-key="'+g.key+'">'+
                '<span>'+g.label+'　対応済み（'+g.items.length+'組）</span>'+
                '<span class="hn-chev">'+(open?'閉じる ▲':'開く ▼')+'</span>'+
              '</button>'+
              (open ? '<div class="hn-history-list">'+g.items.map(historyRowHTML).join('')+'</div>' : '')+
            '</div>';
          }).join('')+
        '</div>')+
      '</div>';
    bindTabs();

    root.querySelectorAll('[data-hist-key]').forEach(btn=>{
      btn.onclick = ()=>{
        const key = btn.getAttribute('data-hist-key');
        if(openHistoryDays.has(key)) openHistoryDays.delete(key); else openHistoryDays.add(key);
        render();
      };
    });
    document.getElementById('hnReset').onclick = async ()=>{
      if(!confirm('待機中のお客様をクリアし、受付番号を1からリセットします。過去7日間の対応履歴は保持されます。よろしいですか？')) return;
      const now = Date.now();
      const cutoff = now - HISTORY_WINDOW_MS;
      state.entries.forEach(e=>{
        if(e.status==='waiting' || e.status==='called'){ e.status='cancelled'; e.finishedAt = now; }
      });
      state.entries = state.entries.filter(e => e.createdAt >= cutoff);
      state.counter = 0;
      state.counterDay = dayKeyJa(now);
      await saveState();
      render();
    };
    root.querySelectorAll('[data-act]').forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.getAttribute('data-id');
        const act = btn.getAttribute('data-act');
        const entry = state.entries.find(e=>e.id===id);
        if(!entry) return;
        if(act==='call') entry.status='called';
        if(act==='done'){ entry.status='done'; entry.finishedAt = Date.now(); }
        if(act==='cancel'){ entry.status='cancelled'; entry.finishedAt = Date.now(); }
        await saveState();
        render();
      };
    });
  }

  function historyRowHTML(e){
    const waited = e.finishedAt ? Math.max(0, Math.floor((e.finishedAt - e.createdAt)/60000)) : null;
    const statusLabel = e.status==='done' ? '案内済み' : '取消';
    return '<div class="hn-history-row">'+
      '<div class="hn-row-num">'+e.number+'</div>'+
      '<div class="hn-row-main">'+
        '<div class="hn-row-name">'+escapeHTML(e.name)+' 様　'+e.count+'名</div>'+
        '<div class="hn-row-sub"><span>'+seatLabel(e.seat)+'</span><span>'+clockTimeJa(e.createdAt)+'受付</span>'+
          (waited!==null ? '<span>待ち時間 '+waited+'分</span>' : '')+
          '<span class="hn-badge '+(e.status==='done'?'done':'cancelled')+'">'+statusLabel+'</span></div>'+
      '</div></div>';
  }

  function timeAgoJa(ts){
    const min = Math.max(0, Math.floor((Date.now() - ts)/60000));
    if(min < 1) return 'たった今';
    return min + '分待ち';
  }

  function bindTabs(){
    root.querySelectorAll('[data-nav]').forEach(a=>{
      a.onclick = (ev)=>{ ev.preventDefault(); view = a.getAttribute('data-nav'); render(); };
    });
  }

  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function isEditingForm(){
    // The customer entry form (no ticket yet) has live text/selection input.
    // Skip re-rendering it once it's already on screen, so background polling
    // doesn't wipe what someone typed — but only once it actually exists;
    // otherwise the very first render would never happen.
    return view === 'customer' && !myTicketId && !!root.querySelector('#hnSubmit');
  }

  async function tick(){
    if(busy) return;
    busy = true;
    try{
      await loadState();
      if(view==='customer' && myTicketId){
        const myTicket = state.entries.find(e => e.id === myTicketId);
        if(myTicket && !isToday(myTicket.createdAt)){
          // A new day has started — don't keep showing yesterday's ticket
          // (whatever its status) on the customer's phone. Forget it locally
          // so re-opening the page or re-scanning the QR shows a fresh form.
          myTicketId = null;
          lastKnownTicketStatus = null;
          await clearMyTicket();
        }
      }
      if(view==='staff' && !prunedThisSession){
        // One-time per staff session: drop finished entries past the 7-day
        // history window so the Firebase state doesn't grow unbounded.
        prunedThisSession = true;
        const cutoff = Date.now() - HISTORY_WINDOW_MS;
        const before = state.entries.length;
        state.entries = state.entries.filter(e => !((e.status==='done'||e.status==='cancelled') && e.createdAt < cutoff));
        if(state.entries.length !== before) await saveState();
      }
      if(!isEditingForm()) render();
    }
    catch(e){ /* ignore transient errors */ }
    busy = false;
  }

  async function checkForUpdate(){
    try{
      const res = await fetch('./version.json?t=' + Date.now(), { cache: 'no-store' });
      if(!res.ok) return;
      const data = await res.json();
      if(data && data.v && data.v !== APP_VERSION && !isEditingForm()){
        // A new version has been deployed — reload so this page (and anyone
        // who's had it open a while, e.g. a waiting customer's ticket screen)
        // picks up the latest code. Skipped only while someone's actively
        // typing into the check-in form, so nothing gets wiped mid-entry;
        // it will simply retry on the next check.
        location.reload();
      }
    }catch(e){ /* offline or blocked — just retry on the next interval */ }
  }

  (async function init(){
    root.innerHTML = '<div class="hn-shell"><div class="hn-header"><div class="hn-sub">読み込み中…</div></div></div>';
    await loadMyTicket();
    await tick();
    pollTimer = setInterval(tick, 4000);
    setInterval(checkForUpdate, 30000);
  })();
})();
</script>

</body>
